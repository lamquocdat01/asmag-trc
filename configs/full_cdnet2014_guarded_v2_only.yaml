experiment_name: full_cdnet2014_guarded_v2_only
dataset_mode: cdnet
dataset_root: "D:/THS Programing/06.6 ASMAG Project/dataset cdnet2014/archive/dataset"
output_root: "outputs"
resume_existing_results: true
checkpoint_resume: true
ai_intervention_dry_run: true

runtime:
  device_mode: cpu_edge_sim
  cuda_enabled: false
  batch_size: 1
  max_threads: 4
  opencv_num_threads: 4
  torch_num_threads: 4
  process_priority: normal
  sequential_video_processing: true
  parallel_jobs: 1

progress:
  auto_recover_stale_jobs: true
  stale_running_minutes: 10
  print_progress_every_frames: 25
  write_progress_every_frames: 25
  progress_heartbeat_seconds: 30
  show_eta: true
  show_current_frame: true
  show_overall_percent: true

categories:
  - badWeather
  - baseline
  - cameraJitter
  - dynamicBackground
  - intermittentObjectMotion
  - lowFramerate
  - nightVideos
  - PTZ
  - shadow
  - thermal
  - turbulence

videos: auto

pipelines:
  - ASMAG_TR_CONTROLLER_ONLINE_GUARDED

detector_mode: yolo
model_name: yolo26s-seg
model_path: "models/yolo/yolo26s-seg.pt"

edge_profile:
  name: full_cdnet2014_guarded_v2_dryrun_cpu_edge
  simulated_cores: 4
  simulated_ram_gb: 32
  delay_penalty_sec: 0.0
  resize_width_for_gating: 320

evaluation:
  use_temporal_roi: true
  warmup_frames: 50
  frame_step: 1
  max_frames_per_video: null
  save_binary_masks: false
  save_qualitative_samples: false

online_controller_calibrated:
  window: 30
  initial_mode: ACC
  use_hysteresis: false
  mode_policy_path: "outputs/q2_core_extended_online_controller_calibrated/online_mode_policy.pkl"

online_controller_guarded:
  guarded_event_safety_v2_enabled: true
  window: 30
  initial_mode: ACC
  use_hysteresis: true
  min_stable_frames: 8
  max_switch_per_100_frames: 4
  mode_policy_path: "outputs/q2_core_extended_online_controller_calibrated/online_mode_policy.pkl"
  resize_width_for_gating: 320
  motion_disagreement_threshold: 0.06
  scene_uncertainty_threshold: 0.52
  gate_instability_threshold: 0.55
  min_motion_density_for_guard: 0.001
  foreground_risk_threshold: 0.55
  forced_refresh_interval: 15
  low_activation_refresh_threshold: 0.45
  max_reuse_age: 4
  reuse_confidence_min: 0.25
  guard_min_interval_frames: 12
  max_consecutive_p3_guard_frames: 3
  guard_exit_disagreement_threshold: 0.035
