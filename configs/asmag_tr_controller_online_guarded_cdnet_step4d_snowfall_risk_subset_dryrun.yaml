base_config: asmag_tr_controller_online_guarded_cdnet_step4c_sofa_risk_subset_dryrun.yaml

experiment_name: asmag_tr_controller_online_guarded_cdnet_step4d_snowfall_risk_subset_dryrun
output_root: "outputs"
resume_existing_results: true
checkpoint_resume: true

progress:
  auto_recover_stale_jobs: true
  stale_running_minutes: 1

online_controller_guarded:
  ai_intervention_dry_run: true

  ai_snowfall_weather_rescue_enabled: true
  ai_snowfall_weather_target_video: badWeather/snowFall
  ai_snowfall_weather_rescue_allow_detector: false
  ai_snowfall_weather_rescue_extra_cap_per_video: 12
  ai_snowfall_weather_rescue_cooldown: 1
  ai_snowfall_weather_rescue_requires_not_normal_frame: true
  ai_snowfall_weather_rescue_requires_active_memory: true
  ai_snowfall_weather_rescue_active_memory_min: 1
  ai_snowfall_weather_rescue_event_score_threshold: 0.50
  ai_snowfall_weather_rescue_foreground_loss_threshold: 0.60
  ai_snowfall_weather_rescue_foreground_risk_threshold: 0.25
  ai_snowfall_weather_rescue_requires_cap_exhausted_or_closed_empty_budget: true
  ai_snowfall_weather_rescue_actions:
    - CLOSED_EMPTY_ACC
    - CLOSED_EMPTY_P3_FALLBACK
  ai_snowfall_weather_rescue_keep_final_normal_suppressor: true

  ai_snowfall_weather_localized_guard_enabled: true
  ai_snowfall_weather_localized_guard_require_event_memory: true
  ai_snowfall_weather_localized_guard_require_not_normal_frame: true
  ai_snowfall_weather_localized_guard_min_foreground_risk: 0.20
  ai_snowfall_weather_localized_guard_allow_foreground_loss_bridge: true
  ai_snowfall_weather_localized_guard_foreground_loss_bridge_threshold: 0.60
  ai_snowfall_weather_localized_guard_no_detector: true

  ai_snowfall_weather_proposal_guard_enabled: true
  ai_snowfall_weather_max_proposal_rate: 0.45
  ai_snowfall_weather_preferred_proposal_rate: 0.40
  ai_snowfall_weather_max_detector_rate: 0.03
  ai_snowfall_weather_no_detector: true
  ai_snowfall_weather_cap_generic_only: true
  ai_snowfall_weather_do_not_cap_rescue_frames: true
  ai_snowfall_weather_do_not_cap_likely_unprotected_fn: true

edge_profile:
  name: guarded_step4d_snowfall_subset_dryrun_cpu_edge
