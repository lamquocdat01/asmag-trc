  ai_copymachine_fn_rescue_requires_localized_risk: true
  ai_copymachine_fn_rescue_event_score_threshold: 0.80
  ai_copymachine_fn_rescue_foreground_loss_threshold: 0.60

edge_profile:
  name: guarded_targeted_category_2l_cpu_edge
