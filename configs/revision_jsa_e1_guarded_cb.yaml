# E1 [R3.2] — GUARDED + persistent-motion circuit breaker (ON).
# Same subset/protocol as revision_jsa_e1_guarded_baseline.yaml; the only
# difference is circuit_breaker.enabled: true. Deterministic hysteresis params
# per the revision plan.
base_config: full_cdnet2014_guarded_v2_clean.yaml

experiment_name: guarded_cb
output_root: "outputs/revision_jsa/e1_circuit_breaker"
resume_existing_results: false
checkpoint_resume: true

categories:
  - baseline
  - intermittentObjectMotion

videos:
  baseline: [highway, office]
  intermittentObjectMotion: [sofa]

evaluation:
  use_temporal_roi: true
  warmup_frames: 50
  frame_step: 1
  max_frames_per_video: null

pipelines:
  - ASMAG_TR_CONTROLLER_ONLINE_GUARDED

circuit_breaker:
  enabled: true
  theta_high: 0.85   # enter bypass when rolling activation exceeds this
  theta_low: 0.60    # exit bypass when a probe measures below this (hysteresis)
  window: 60         # W  — rolling activation window
  probe_every: 300   # K  — frames between probes while bypassed
  probe_len: 30      # P  — probe duration
