base_config: asmag_tr_controller_online_guarded_cdnet_step4e_port_detector_subset_dryrun.yaml

experiment_name: asmag_tr_controller_online_guarded_cdnet_step4e3_port_detector_subset_dryrun
output_root: "outputs"
resume_existing_results: true
checkpoint_resume: true

progress:
  auto_recover_stale_jobs: true
  stale_running_minutes: 1

online_controller_guarded:
  ai_intervention_dry_run: true

  ai_port_lf_detector_retighten_v3_enabled: true
  ai_port_lf_detector_retighten_v3_target_video: lowFramerate/port_0_17fps
  ai_port_lf_detector_retighten_v3_no_detector: true
  ai_port_lf_detector_retighten_v3_use_final_event_state: true
  ai_port_lf_detector_retighten_v3_log_decision_and_final_state: true
  ai_port_lf_detector_retighten_v3_suppress_final_fp_tn_refresh: true
  ai_port_lf_detector_retighten_v3_keep_actual_fn_detector: true
  ai_port_lf_detector_retighten_v3_keep_true_deterministic_emergency: true
  ai_port_lf_detector_retighten_v3_do_not_treat_generic_refresh_as_emergency: true
  ai_port_lf_detector_retighten_v3_do_not_treat_generic_event_fg_as_likely_fn: true
  ai_port_lf_detector_retighten_v3_keep_only_explicit_likely_unprotected_fn: true
  ai_port_lf_detector_retighten_v3_max_detector_rate: 0.03000
  ai_port_lf_detector_retighten_v3_preferred_detector_rate: 0.02000
  ai_port_lf_detector_retighten_v3_use_no_detector_fallback: true
  ai_port_lf_detector_retighten_v3_fallback_source: existing_lowframerate_fallback_or_sanitizer
  ai_port_lf_detector_retighten_v3_keep_event_safety: true

edge_profile:
  name: guarded_step4e3_port_detector_subset_dryrun_cpu_edge
