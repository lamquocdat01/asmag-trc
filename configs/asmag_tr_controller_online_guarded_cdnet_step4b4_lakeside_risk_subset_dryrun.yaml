  ai_thermal_lakeside_highscore_soften_recent_age_hard_max: 4
  ai_thermal_lakeside_highscore_soften_reuse_age_soft_min: 6
  ai_thermal_lakeside_highscore_soften_require_not_event_fn: true
  ai_thermal_lakeside_highscore_soften_never_soften_rescue_frames: true
  ai_thermal_lakeside_highscore_soften_never_soften_likely_unprotected_fn: true
  ai_thermal_lakeside_highscore_soften_never_soften_deterministic_emergency: true

  ai_thermal_lakeside_highscore_soft_trim_enabled: true
  ai_thermal_lakeside_highscore_soft_trim_target_video: thermal/lakeSide
  ai_thermal_lakeside_highscore_soft_trim_target_rate: 0.49
  ai_thermal_lakeside_highscore_soft_trim_hard_max_rate: 0.50
  ai_thermal_lakeside_highscore_soft_trim_no_detector: true
  ai_thermal_lakeside_highscore_soft_trim_min_trim_frames: 5
  ai_thermal_lakeside_highscore_soft_trim_max_trim_frames: 8
  ai_thermal_lakeside_highscore_soft_trim_never_trim_hard_protected: true
  ai_thermal_lakeside_highscore_soft_trim_never_trim_rescue_frames: true
  ai_thermal_lakeside_highscore_soft_trim_never_trim_likely_unprotected_fn: true
  ai_thermal_lakeside_highscore_soft_trim_stop_at_rate: 0.50

