  ai_thermal_lakeside_fg_loss_soft_trim_target_rate: 0.49
  ai_thermal_lakeside_fg_loss_soft_trim_hard_max_rate: 0.50
  ai_thermal_lakeside_fg_loss_soft_trim_no_detector: true
  ai_thermal_lakeside_fg_loss_soft_trim_min_trim_frames: 10
  ai_thermal_lakeside_fg_loss_soft_trim_max_trim_frames: 16
  ai_thermal_lakeside_fg_loss_soft_trim_never_trim_hard_protected: true
  ai_thermal_lakeside_fg_loss_soft_trim_never_trim_likely_unprotected_fn: true
  ai_thermal_lakeside_fg_loss_soft_trim_never_trim_rescue_frames: true
