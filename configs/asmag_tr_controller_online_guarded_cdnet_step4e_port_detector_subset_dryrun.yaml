  stale_running_minutes: 1

online_controller_guarded:
  ai_intervention_dry_run: true

  ai_port_lf_detector_retighten_enabled: true
  ai_port_lf_detector_retighten_target_video: lowFramerate/port_0_17fps
  ai_port_lf_detector_retighten_no_detector: true
  ai_port_lf_detector_retighten_suppress_fp_tn_refresh: true
  ai_port_lf_detector_retighten_keep_fn_protecting_detector: true
  ai_port_lf_detector_retighten_keep_deterministic_emergency: true
  ai_port_lf_detector_retighten_require_likely_unprotected_fn_for_detector: true
  ai_port_lf_detector_retighten_max_detector_rate: 0.03000
  ai_port_lf_detector_retighten_preferred_detector_rate: 0.02000
  ai_port_lf_detector_retighten_use_no_detector_fallback: true
  ai_port_lf_detector_retighten_fallback_source: existing_lowframerate_fallback_or_sanitizer
  ai_port_lf_detector_retighten_keep_event_safety: true

edge_profile:
  name: guarded_step4e_port_detector_subset_dryrun_cpu_edge
