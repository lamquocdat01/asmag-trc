# which has since drifted (see jetson/README.md "Measurement traps" and
# outputs/revision_jsa/e6_jetson/software_drift_finding.md). ALL revised Jetson
# tables are measured on this single pinned stack (canonical image
# `l4t-pytorch-asmag:local`) so absolute numbers are reproducible going forward.
